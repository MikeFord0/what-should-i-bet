# Runs on GitHub's servers once a day:
#   1. builds the C++ program
#   2. asks Claude for today's pick (writes site/pick.json)
#   3. commits pick.json, so the repo keeps a history of every pick
#   4. publishes the site/ folder to GitHub Pages
name: Daily pick

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10 AM Eastern (9 AM in winter)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write   # to commit pick.json
  pages: write      # to publish the site
  id-token: write   # required by the Pages deploy action

concurrency:
  group: daily-pick
  cancel-in-progress: false

jobs:
  pick-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Ask Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TZ: America/New_York
        run: ./build/daily_pick site/pick.json

      - name: Commit the new pick
        run: |
          git config user.name "daily-pick-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/pick.json
          git commit -m "Pick for $(TZ=America/New_York date +%F)" || echo "No change"
          git push

      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
